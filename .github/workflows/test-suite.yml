name: Test Suite
# Run test suite on ref and uploads coverage artifacts

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: The ref to check out before running tests
        required: true
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: |
          pytest \
            --cov=src \
            --cov-branch \
            --cov-report=lcov:coverage/lcov.info \
            --cov-report=json:coverage/coverage.json \
            --cov-report=markdown:coverage/coverage.md \
            --cov-report=term-missing:skip-covered \
            tests/
      - name: Make summary
        run: |
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo "### Coverage for Python ${{ matrix.python-version }} on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>Click to expand</summary>" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage.md >> $GITHUB_STEP_SUMMARY
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: coverage/*
