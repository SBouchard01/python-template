name: CI - Validate
# Lint, Typecheck, Format, Test Suite, CRAP Score

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Run linter
        run: uvx ruff check .
      - name: Run formatter
        run: uvx ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Get number of type errors # First run is to get the number of errors without failing
        run: uvx ty check src --quiet --exit-zero --python-version 3.13
      - name: Run type checker # Second run is to get the output in GitHub format for annotations
        run: uvx ty check src --output-format github  --python-version 3.13 

  test-suite:
    name: Test Suite
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read
      checks: write
    with:
      checkout_ref: ${{ github.sha }}

  crapscore:
    name: CRAP Score
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Download artifacts from test suite
        uses: actions/download-artifact@v7
        with:
          name: coverage-3.13-ubuntu-latest
      - name: Run crap score
        run: uvx crap4py src/ --lcov lcov.info --max-crap 10 >> crapscore.txt
      - name: Make summary
        run: |
          echo "### CRAP Score" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>Click to expand</summary>" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat crapscore.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
