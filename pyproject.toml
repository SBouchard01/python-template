[build-system]
requires = ["setuptools", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "my_package"
# description = "A short description of the project."
# authors = []
# maintainers = []
# classifiers = []
readme = "README.md"
license = "MIT"
dynamic = ["version"]  # read from git tags
requires-python = ">= 3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "crap4py",
]
docs = [
    "sphinx",
    "sphinx-book-theme",
    "myst_nb",
]

[project.urls]
# Repository = "https://github.com/myusername/my_package"
# Documentation = "https://readthedocs.org"
# Issues = "https://github.com/myusername/my_package/issues"

[tool.setuptools-git-versioning]
enabled = true
starting_version = "0.0.0" # Fallback version if no git tags are found
tag_filter = "^v?\\d+\\.\\d+\\.\\d+.*$"

# Uncomment if package discovery does not work as expected
# [tool.setuptools]
# package-dir = {"" = "src"}    # directory containing all the packages
# include-package-data = true   # default bahavior

[tool.pytest]
filterwarnings = [
    "ignore::DeprecationWarning::",  # ignore deprecations from all modules
    "default::DeprecationWarning:mymodule.*:",  # except from mymodule
]

[tool.coverage.run]
omit = []

[tool.ty.rules]
import-not-found = "ignore" # Ignore unresolved imports, as some dependencies may not be installed in all environments.
incompatible-method-override = "warn" # Warn about invalid method overrides, as some may be intentional due to limitations in type checking.

[tool.ty.terminal]
error-on-warning = false # Do not treat warnings as errors, as some warnings may be intentional and not critical.

[tool.ruff]
line-length = 88
output-format = "grouped"
respect-gitignore = true
show-fixes = true
exclude = [
    "docs/*",
]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
unfixable = ["F541"] # Disable F541 because can produce wrong fix with latex
ignore = [
    "AIR",      # Airflow
    "CPY",      # flake8-copyright
    "EM",       # flake8-errmsg
    "FA",       # flake8-future-annotations
    "FAST",     # FastAPI
    "FBT",      # flake8-boolean-trap
    "FIX",      # flake8-fixme
    "G",        # flake8-logging-format
    "PGH",      # pygrep-hooks
    "TD",       # flake8-todos
    "YTT",      # flake8-2020

    # I don't like it:
    "PD011",    # Checks for uses of .values on Pandas Series and Index objects.
    "RET504",   # Return statements should not contain assignment expressions
    "D104",     # Missing docstring in public package

    # don't care about these:
    "ERA",      # Found commented-out code
    "SLF",      # Private member accessed
    "ANN002",   # Missing type annotation for *args
    "ANN003",   # Missing type annotation for **kwargs
    "S307",     # Use of potentially insecure function
    "S311",     # Standard pseudo-random generators are not suitable for security/cryptographic purposes

    # actually makes code harder to read:
    "D203",     # 1 blank line required before class docstring
    "PT003",    # scope='function' is implied in @pytest.fixture()
    "TRY003",   # Avoid specifying long messages outside the exception class
    "UP015",    # Unnecessary mode argument

    # disable these rules to use the ruff formatter.
    "COM812",   # missing-trailing-comma
    "COM819",   # prohibited-trailing-comma
    "D206",     # docstring-tab-indentation
    "D300",     # triple-single-quotes
    "E111",     # indentation-with-invalid-multiple
    "E114",     # indentation-with-invalid-multiple-comment
    "E117",     # over-indented
    "E501",     # line-too-long
    "Q000",     # bad-quotes-inline-string
    "Q001",     # bad-quotes-multiline-string
    "Q002",     # bad-quotes-docstring
    "Q003",     # avoidable-escaped-quote
    "W191",     # tab-indentation
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # suppress ANN401 for *args and **kwargs

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py, as they are often used for package exports.
"*.ipynb" = [ # Notebooks
    "T201", # Ignore print statements
]
"tests/**/*.py" = [ # Test files
    "ANN", # Ignore missing type annotations
    "ARG", # Ignore unused arguments
    "D",   # Ignore missing docstrings
    "INP001", # Ignore implicit package
    "S101", # Ignore assert statements
    "T201", # Ignore print statements
]
