name: Generate Changelog
# Generate release notes draft between two tags

on:
  workflow_call:
    inputs:
      bump:
        description: Whether to bump the version number
        required: false
        type: boolean
        default: false
      from-ref:
        description: Git ref (tag or commit) that marks the start of the changelog range
        required: true
        type: string
      to-ref:
        description: Git ref (tag or commit) that marks the end of the changelog range
        required: true
        type: string

    outputs:
      compare-url:
        description: Compare URL for the computed range
        value: ${{ jobs.compute-release-notes.outputs.compare-url }}
      details-url:
        description: Workflow run URL that contains the full markdown summary
        value: ${{ jobs.compute-release-notes.outputs.details-url }}
      version:
        description: Predicted semantic version for the supplied range
        value: ${{ jobs.compute-release-notes.outputs.version }}
      release-notes:
        description: Markdown notes generated from conventional commits
        value: ${{ jobs.compute-release-notes.outputs.release-notes }}

jobs:
  compute-release-notes:
    name: Compute Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compare-url: ${{ steps.summary.outputs.compare-url }}
      details-url: ${{ steps.summary.outputs.details-url }}
      version: ${{ steps.git-cliff.outputs.version }}
      release-notes: ${{ steps.git-cliff.outputs.release-notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.to-ref }}
      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v1
      - name: Generate release notes
        id: git-cliff
        shell: bash
        env:
          IS_BUMP: ${{ inputs.bump }}
          GIT_CLIFF_CONFIG: .github/workflows/cliff.toml
          FROM_REF: ${{ inputs.from-ref }}
          TO_REF: ${{ inputs.to-ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -eu
          
          git-cliff \
            --config ${GIT_CLIFF_CONFIG} \
            --context \
            --output range-context.json \
            "${FROM_REF}..${TO_REF}"
          
          if [ "${IS_BUMP}" = "true" ]; then
            BUMP_ARGUMENT="--bump"
          else
            BUMP_ARGUMENT=""
          fi
          
          git-cliff \
            --config ${GIT_CLIFF_CONFIG} \
            --from-context range-context.json \
            ${BUMP_ARGUMENT} \
            --output range-notes.md \
            "${FROM_REF}..${TO_REF}"
          
          DELIMITER="EOF_$(openssl rand -hex 16)"

          {
            echo "release-notes<<${DELIMITER}"
            cat range-notes.md
            printf "\n"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"
          
          PREDICTED_VERSION=$(
            git-cliff \
              --config ${GIT_CLIFF_CONFIG} \
              --from-context range-context.json \
              --bumped-version \
              "${FROM_REF}..${TO_REF}"
          )

          echo "version=${PREDICTED_VERSION}" >> "$GITHUB_OUTPUT"
        
      - name: Make summary
        id: summary
        shell: bash
        env:
          FROM_REF: ${{ inputs.from-ref }}
          TO_REF: ${{ inputs.to-ref }}
          PREDICTED_VERSION: ${{ steps.git-cliff.outputs.version }}
          RELEASE_NOTES: ${{ steps.git-cliff.outputs.release-notes }}
          DETAILS_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          COMPARE_URL: ${{ format('{0}/{1}/compare/{2}...{3}', github.server_url, github.repository, inputs.from-ref, inputs.to-ref) }}
        run: |
          set -eu

          echo "compare-url=${COMPARE_URL}" >> "$GITHUB_OUTPUT"
          echo "details-url=${DETAILS_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## Full Changelog"
            echo
            echo "- Range: \`${FROM_REF}..${TO_REF}\`"
            echo "- Predicted version: \`${PREDICTED_VERSION:-none}\`"

            if [ -n "$COMPARE_URL" ]; then
              echo "- Compare: ${COMPARE_URL}"
            fi

            echo
            echo "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
